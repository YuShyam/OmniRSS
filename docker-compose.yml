version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: omnirss-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - omnirss-net
    depends_on:
      - app

  app:
    build: .
    image: omnirss:latest
    container_name: omnirss-app
    restart: unless-stopped
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ./plugins:/app/plugins
      - ./layouts:/app/layouts
      - ./locales:/app/locales
      - ./logs:/app/logs
    networks:
      - omnirss-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  omnirss-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
