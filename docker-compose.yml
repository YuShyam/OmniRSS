version: '3.8'

services:
  app:
    build: .
    image: omnirss:latest
    container_name: omnirss-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8000"
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ./plugins:/app/plugins
      - ./layouts:/app/layouts
      - ./locales:/app/locales
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
