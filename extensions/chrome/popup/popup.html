<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniRSS Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
        <span>OmniRSS 快剪</span>
      </div>
      <div class="status-pill" id="conn-badge">連線檢測中...</div>
    </header>

    <main class="popup-content">
      <div class="article-preview" id="preview-box">
        <div class="preview-title" id="preview-title">正在讀取當前分頁資訊...</div>
        <div class="preview-url text-muted" id="preview-url"></div>
      </div>

      <div class="action-buttons">
        <button class="btn btn-primary" id="btn-clip-page">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>📌 存入 OmniRSS</span>
        </button>

        <button class="btn btn-secondary" id="btn-edge-relay">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span>🔄 立即執行邊緣中繼</span>
        </button>
      </div>

      <div class="toast-msg" id="toast-msg"></div>
    </main>

    <footer class="popup-footer">
      <a href="../options/options.html" target="_blank" class="footer-link">⚙️ 伺服器與金鑰設定</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
